<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riesenrad – Höhe einer Gondel</title>
<style>
  :root{--akzent:#2E5AAC;--akzent-dunkel:#1c3a72;--grau:#666;--bg:#fff;--panel:#f2f5fb;--rand:#cdd8ee;
        --sin:#D2323C;--cos:#2856BE;--gondel:#D2323C;--stahl:#5b6472;
        --gruen:#2f8f4e;--orange:#C77F1A;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#1b1b1b;background:var(--bg);}
  .wrap{max-width:1000px;margin:0 auto;padding:14px;}
  h1{font-size:1.15rem;color:var(--akzent-dunkel);margin:.2rem 0 .1rem;}
  .sub{font-size:.9rem;color:var(--grau);margin:0 0 .7rem;line-height:1.4;}
  svg{width:100%;height:auto;touch-action:none;user-select:none;}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;}
  .fig{flex:3 1 580px;min-width:320px;}
  .side{flex:1 1 240px;min-width:230px;}
  .panel{background:var(--panel);border:1px solid var(--rand);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
  .seg{display:inline-flex;border:1px solid var(--akzent);border-radius:8px;overflow:hidden;margin-bottom:8px;}
  .seg button{border:0;background:#fff;color:var(--akzent);font:inherit;padding:7px 16px;cursor:pointer;}
  .seg button.aktiv{background:var(--akzent);color:#fff;}
  .readout .zeile{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--rand);}
  .readout .zeile:last-child{border-bottom:none;}
  .readout .lab{font-size:.92rem;color:#333;}
  .readout .val{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem;}
  .val.h{color:var(--akzent-dunkel);} .val.p{color:var(--gruen);}
  .term{font-variant-numeric:tabular-nums;font-weight:600;font-size:.98rem;white-space:nowrap;margin-bottom:4px;}
  .params{font-size:.82rem;color:var(--grau);}
  label.ctl{display:block;font-size:.9rem;color:var(--grau);margin:.2rem 0 .3rem;}
  input[type=range]{width:100%;accent-color:var(--akzent);}
  .btns{display:flex;gap:8px;margin-top:8px;}
  button.b{font:inherit;border:1px solid var(--akzent);background:#fff;color:var(--akzent);border-radius:8px;padding:6px 12px;cursor:pointer;}
  button.b:hover:not(:disabled){background:var(--akzent);color:#fff;}
  button.b.aktiv{background:var(--akzent);color:#fff;}
  button.b:disabled{border-color:#c7cdd8;color:#9aa1ad;cursor:default;background:#f4f6fa;}
  button:focus-visible{outline:3px solid #9db6e6;outline-offset:2px;}
  .tg{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:7px 0;}
  .tg input{width:16px;height:16px;}
  #eqBtn{width:100%;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Riesenrad – Höhe einer Gondel</h1>
  <p class="sub">Ein Riesenrad hat einen Durchmesser von 50 Metern. Der tiefste Punkt der Gondeln befindet sich 2 Meter über dem Boden. Eine volle Umdrehung des Riesenrades dauert genau 8 Minuten.</p>
  <div class="row">
    <div class="fig">
      <svg id="fig" viewBox="0 0 900 470" aria-label="Riesenrad mit Gondel und Höhe-Zeit-Graph">
        <g id="axis"></g>
        <line id="leg1" stroke="var(--stahl)" stroke-width="4"/>
        <line id="leg2" stroke="var(--stahl)" stroke-width="4"/>
        <circle id="rim" cx="180" cy="233" r="150" fill="none" stroke="var(--stahl)" stroke-width="3"/>
        <g id="spokes"></g>
        <g id="cabins"></g>
        <!-- Hilfe: rechtwinkliges Dreieck -->
        <g id="hilfe" style="display:none">
          <line id="hMid" stroke="#9aa4b8" stroke-width="1" stroke-dasharray="4 5" opacity="0.7"/>
          <line id="triHyp" stroke="#333" stroke-width="1.8"/>
          <line id="triH" stroke="var(--orange)" stroke-width="3"/>
          <line id="triV" stroke="var(--gruen)" stroke-width="3"/>
          <path id="triRA" fill="none" stroke="#333" stroke-width="1.3"/>
          <path id="triArc" fill="none" stroke="var(--gruen)" stroke-width="1.8"/>
          <text id="triPhi" font-size="13" font-weight="600" fill="var(--gruen)"></text>
        </g>
        <circle id="hub" cx="180" cy="233" r="6" fill="var(--stahl)"/>
        <line id="hLine" stroke="var(--sin)" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.7"/>
        <circle id="gondel" r="8" fill="var(--gondel)" stroke="#fff" stroke-width="2"/>
        <text id="hLab" font-size="12" font-weight="600" fill="var(--akzent-dunkel)"></text>
        <!-- Graph -->
        <line id="head" stroke="#9aa4b8" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.5"/>
        <path id="curve" fill="none" stroke="var(--sin)" stroke-width="2.8"/>
        <circle id="gdot" r="5" fill="var(--sin)"/>
      </svg>
    </div>
    <div class="side">
      <div class="seg" role="group" aria-label="Darstellung als Sinus oder Kosinus">
        <button id="btnSin" class="aktiv">Sinus</button><button id="btnCos">Kosinus</button>
      </div>
      <div class="panel readout">
        <div class="zeile"><span class="lab">Zeit t</span><span class="val h" id="rT">0,0 min</span></div>
        <div class="zeile"><span class="lab">Höhe h</span><span class="val h" id="rH">2,0 m</span></div>
        <div class="zeile"><span class="lab">Drehwinkel φ</span><span class="val p" id="rP">0°</span></div>
      </div>
      <div class="panel">
        <button class="b" id="eqBtn" disabled>Gleichung in 300 s</button>
        <div id="termBox" style="display:none;margin-top:8px">
          <div class="term" id="term"></div>
          <div class="params" id="params"></div>
        </div>
      </div>
      <div class="panel">
        <label class="ctl" for="tS">Zeit ziehen oder Gondel drehen</label>
        <input id="tS" type="range" min="0" max="16" step="0.1" value="0" aria-label="Zeit in Minuten">
        <div class="btns"><button class="b" id="play">▶ Start</button><button class="b" id="reset">Anfang</button></div>
        <div class="tg"><input type="checkbox" id="gGraph" checked><label for="gGraph">Graph zeichnen</label></div>
        <div class="tg"><input type="checkbox" id="gHilfe"><label for="gHilfe">Hilfe: rechtwinkliges Dreieck</label></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const NS='http://www.w3.org/2000/svg', PI=Math.PI;
  const RED='#D2323C', BLUE='#2856BE';
  const CXw=180, GROUND=395, S=6;
  const CYw=GROUND-27*S, R=25*S;
  const GX=x=>CXw+x*S, GY=y=>GROUND-y*S;
  const X0=380, W=490, TMAX=16;
  const Xg=t=>X0+t/TMAX*W;
  const h=t=>27-25*Math.cos(PI/4*t);
  const theta=t=>PI/4*t;
  let t=0, mode='sin', playing=false, raf=null, revealed=false;

  function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
  function txt(x,y,s,anc){const e=el('text',{x:x,y:y,'font-size':11,fill:'#666','text-anchor':anc||'start'});e.textContent=s;return e;}
  const nf=(x,n=1)=>x.toFixed(n).replace('.',',');
  const col=()=>mode==='sin'?RED:BLUE;

  (function(){
    const g=$('axis');
    g.appendChild(el('line',{x1:GX(-27),y1:GROUND,x2:Xg(TMAX)+24,y2:GROUND,stroke:'#b9c0cc','stroke-width':2}));
    g.appendChild(txt(GX(-26),GROUND+16,'Boden','start'));
    $('leg1').setAttribute('x1',CXw-46);$('leg1').setAttribute('y1',GROUND);$('leg1').setAttribute('x2',CXw);$('leg1').setAttribute('y2',CYw);
    $('leg2').setAttribute('x1',CXw+46);$('leg2').setAttribute('y1',GROUND);$('leg2').setAttribute('x2',CXw);$('leg2').setAttribute('y2',CYw);
    g.appendChild(el('line',{x1:X0,y1:GY(0),x2:X0,y2:GY(55),stroke:'#9aa4b8','stroke-width':1.1}));
    g.appendChild(el('polygon',{points:`${X0},${GY(55)-8} ${X0-4},${GY(55)+1} ${X0+4},${GY(55)+1}`,fill:'#9aa4b8'}));
    g.appendChild(el('polygon',{points:`${Xg(TMAX)+28},${GROUND} ${Xg(TMAX)+20},${GROUND-4} ${Xg(TMAX)+20},${GROUND+4}`,fill:'#9aa4b8'}));
    [[2,'2'],[27,'27'],[52,'52']].forEach(([v,l])=>{
      g.appendChild(el('line',{x1:X0,y1:GY(v),x2:Xg(TMAX),y2:GY(v),stroke:'#dfe6f2','stroke-width':1,'stroke-dasharray':'3 4'}));
      g.appendChild(txt(X0-7,GY(v)+4,l,'end'));
    });
    g.appendChild(txt(X0-7,GY(55)-2,'h/m','end'));
    for(let k=2;k<=TMAX;k+=2){ const x=Xg(k);
      g.appendChild(el('line',{x1:x,y1:GROUND-3,x2:x,y2:GROUND+3,stroke:'#9aa4b8','stroke-width':1}));
      g.appendChild(txt(x,GROUND+16,k+'','middle'));
    }
    g.appendChild(txt(Xg(TMAX)+26,GROUND-6,'t/min','end'));
    g.appendChild(el('line',{x1:Xg(8),y1:GY(0),x2:Xg(8),y2:GY(55),stroke:'#c9d3e8','stroke-width':1.2,'stroke-dasharray':'2 4'}));
  })();

  function curvePath(upto){ let s=''; for(let x=0;x<=upto+1e-9;x+=0.1){ s+=(s===''?'M':'L')+Xg(x).toFixed(1)+' '+GY(h(x)).toFixed(1);} s+='L'+Xg(upto).toFixed(1)+' '+GY(h(upto)).toFixed(1); return s; }

  function update(){
    const th=theta(t), gx=GX(25*Math.sin(th)), gy=GY(h(t));
    const showGraph=$('gGraph').checked, showHilfe=$('gHilfe').checked, cc=col();
    // Rad
    const sp=$('spokes'), cab=$('cabins'); sp.innerHTML=''; cab.innerHTML='';
    for(let j=0;j<8;j++){ const a=th+j*PI/4; const px=GX(25*Math.sin(a)), py=GY(27-25*Math.cos(a));
      sp.appendChild(el('line',{x1:CXw,y1:CYw,x2:px,y2:py,stroke:'#cfd5de','stroke-width':1.5}));
      if(j!==0) cab.appendChild(el('circle',{cx:px,cy:py,r:5.5,fill:'#eef1f6',stroke:'var(--stahl)','stroke-width':1.5}));
    }
    $('gondel').setAttribute('cx',gx); $('gondel').setAttribute('cy',gy);
    // Hilfsdreieck
    $('hilfe').style.display=showHilfe?'':'none';
    if(showHilfe){
      $('hMid').setAttribute('x1',CXw-R-18);$('hMid').setAttribute('y1',CYw);$('hMid').setAttribute('x2',CXw+R+18);$('hMid').setAttribute('y2',CYw);
      $('triHyp').setAttribute('x1',CXw);$('triHyp').setAttribute('y1',CYw);$('triHyp').setAttribute('x2',gx);$('triHyp').setAttribute('y2',gy);
      $('triV').setAttribute('x1',CXw);$('triV').setAttribute('y1',CYw);$('triV').setAttribute('x2',CXw);$('triV').setAttribute('y2',gy);
      $('triH').setAttribute('x1',CXw);$('triH').setAttribute('y1',gy);$('triH').setAttribute('x2',gx);$('triH').setAttribute('y2',gy);
      const hx=Math.sign(gx-CXw)||1, vy=Math.sign(CYw-gy)||1, m2=9;
      $('triRA').setAttribute('d',`M ${CXw+hx*m2} ${gy} L ${CXw+hx*m2} ${gy+vy*m2} L ${CXw} ${gy+vy*m2}`);
      const ar=38, thm=((th%(2*PI))+2*PI)%(2*PI); let dp='M '+CXw+' '+(CYw+ar);
      for(let s=0;s<=thm+1e-6;s+=0.07){ dp+=' L '+(CXw+ar*Math.sin(s)).toFixed(1)+' '+(CYw+ar*Math.cos(s)).toFixed(1);}
      $('triArc').setAttribute('d',dp);
      const mid=thm/2; $('triPhi').setAttribute('x',CXw+(ar+16)*Math.sin(mid)); $('triPhi').setAttribute('y',CYw+(ar+16)*Math.cos(mid)+4);
      $('triPhi').textContent='φ = '+Math.round(((th*180/PI)%360+360)%360)+'°';
    }
    // Höhenlinie + Graph
    $('hLine').style.display=showGraph?'':'none';
    $('hLine').setAttribute('stroke',cc);
    $('hLine').setAttribute('x1',gx);$('hLine').setAttribute('y1',gy);$('hLine').setAttribute('x2',Xg(t));$('hLine').setAttribute('y2',gy);
    $('hLab').setAttribute('x',gx+12);$('hLab').setAttribute('y',gy+4);$('hLab').textContent=nf(h(t))+' m';
    $('head').style.display=showGraph?'':'none';
    $('head').setAttribute('x1',Xg(t));$('head').setAttribute('y1',GY(0));$('head').setAttribute('x2',Xg(t));$('head').setAttribute('y2',GY(55));
    $('curve').style.display=showGraph?'':'none';
    $('curve').setAttribute('stroke',cc); $('curve').setAttribute('d',curvePath(t));
    $('gdot').style.display=showGraph?'':'none';
    $('gdot').setAttribute('fill',cc); $('gdot').setAttribute('cx',Xg(t)); $('gdot').setAttribute('cy',gy);
    // Readout
    $('rT').textContent=nf(t)+' min'; $('rH').textContent=nf(h(t))+' m';
    $('rP').textContent=Math.round(((th*180/PI)%360+360)%360)+'°';
    $('tS').value=t;
  }

  function setTerm(){ if(!revealed)return; const c=col();
    $('term').textContent = mode==='sin' ? 'h(t) = 25·sin[π/4·(t − 2)] + 27' : 'h(t) = 25·cos[π/4·(t − 4)] + 27';
    $('term').style.color=c;
    $('params').textContent = 'a = 25 · b = π/4 · c = '+(mode==='sin'?'2':'4')+' · d = 27';
  }

  function setT(v){ t=Math.max(0,Math.min(TMAX,v)); update(); }
  function setMode(m){ mode=m; $('btnSin').classList.toggle('aktiv',m==='sin'); $('btnCos').classList.toggle('aktiv',m==='cos'); setTerm(); update(); }

  // Ziehen an der Gondel
  let drag=false;
  function rawT(e){ const r=$('fig').getBoundingClientRect(), sx=900/r.width, sy=470/r.height;
    const x=(e.clientX-r.left)*sx, y=(e.clientY-r.top)*sy;
    if(x>X0-30) return null;
    let ang=Math.atan2(x-CXw,(CYw)-y); let th=ang-PI; th=((th%(2*PI))+2*PI)%(2*PI);
    return th/(PI/4); }
  $('fig').addEventListener('pointerdown',e=>{const v=rawT(e); if(v===null)return; drag=true; $('fig').setPointerCapture(e.pointerId); const base=Math.floor(t/8)*8; setT(base+v);});
  $('fig').addEventListener('pointermove',e=>{ if(!drag)return; const v=rawT(e); if(v===null)return; const base=Math.floor(t/8)*8; let nt=base+v; if(nt-t>4)nt-=8; else if(t-nt>4)nt+=8; setT(Math.max(0,Math.min(TMAX,nt))); });
  $('fig').addEventListener('pointerup',()=>drag=false);
  $('fig').addEventListener('pointercancel',()=>drag=false);

  $('tS').addEventListener('input',()=>setT(+$('tS').value));
  $('reset').addEventListener('click',()=>{stop(); setT(0);});
  $('gGraph').addEventListener('change',update);
  $('gHilfe').addEventListener('change',update);
  $('btnSin').addEventListener('click',()=>setMode('sin'));
  $('btnCos').addEventListener('click',()=>setMode('cos'));

  const playBtn=$('play');
  function stop(){playing=false;playBtn.classList.remove('aktiv');playBtn.textContent='▶ Start';if(raf)cancelAnimationFrame(raf);}
  function loop(){ if(!playing)return; if(t>=TMAX){stop();return;} setT(t+0.04); raf=requestAnimationFrame(()=>setTimeout(loop,24)); }
  playBtn.addEventListener('click',()=>{ if(playing){stop();} else { if(t>=TMAX)setT(0); playing=true; playBtn.classList.add('aktiv'); playBtn.textContent='⏸ Pause'; loop(); } });

  // Gleichung erst nach 300 s freischalten
  let secs=300; const eqBtn=$('eqBtn');
  const iv=setInterval(()=>{ secs--; if(secs<=0){ clearInterval(iv); eqBtn.disabled=false; eqBtn.textContent='Gleichung anzeigen'; } else { eqBtn.textContent='Gleichung in '+secs+' s'; } },1000);
  eqBtn.addEventListener('click',()=>{ if(eqBtn.disabled)return; revealed=true; $('termBox').style.display=''; eqBtn.style.display='none'; setTerm(); });

  update();
})();
</script>
</body>
</html>
