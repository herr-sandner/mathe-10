<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potenzfunktionen mit natürlichen Exponenten</title>
<style>
  :root{
    --akzent:#2E5AAC; --akzent-dunkel:#1c3a72;
    --grau:#666; --bg:#ffffff; --panel:#f2f5fb; --rand:#cdd8ee;
    --kurve:#2856BE; --punkt:#C77F1A; --kurveB:#127a4b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#1b1b1b;background:var(--bg);}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  h1{font-size:1.25rem;color:var(--akzent-dunkel);margin:.2rem 0 1rem;}
  .layout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;}
  .figur{flex:2 1 460px;min-width:320px;}
  .seite{flex:1 1 250px;min-width:240px;}
  svg{width:100%;height:auto;touch-action:none;user-select:none;}
  text{font-family:inherit;}
  .panel{background:var(--panel);border:1px solid var(--rand);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .termbox{padding:22px 16px;}
  .term,.term2{white-space:nowrap;overflow:hidden;}
  .term{text-align:center;font-size:2.1rem;line-height:1.3;font-weight:700;color:var(--akzent-dunkel);padding:2px 0 6px;font-variant-numeric:tabular-nums;}
  .controls label{display:block;font-size:.9rem;color:var(--grau);margin:.5rem 0 .3rem;}
  input[type=range]{width:100%;accent-color:var(--akzent);}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  button{font:inherit;border:1px solid var(--akzent);background:#fff;color:var(--akzent);border-radius:8px;padding:7px 12px;cursor:pointer;}
  button:hover{background:var(--akzent);color:#fff;}
  button:focus-visible{outline:3px solid #9db6e6;outline-offset:2px;}
  .opt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;color:#1b1b1b;}
  .opt input{width:18px;height:18px;}
  #boxB{margin-top:6px;}
  #boxB[hidden]{display:none;}
  .hinweis{font-size:.82rem;color:var(--grau);margin-top:10px;line-height:1.45;}
  .merk{background:#fff7ec;border:1px solid #e7cfa0;border-radius:8px;padding:8px 10px;margin-top:12px;font-size:.9rem;color:#7a5312;line-height:1.45;}
  b.k{color:var(--kurve);} b.p{color:var(--punkt);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Potenzfunktionen mit natürlichen Exponenten</h1>
  <div class="layout">
    <div class="figur">
      <svg id="fig" viewBox="0 0 440 440" aria-label="Koordinatensystem mit dem Graphen einer Potenzfunktion; Faktor a und Exponent n einstellbar, ein Punkt lässt sich am Graphen verschieben.">
        <g id="grid"></g>
        <line id="axX" stroke="#5a6577" stroke-width="1.4"/>
        <line id="axY" stroke="#5a6577" stroke-width="1.4"/>
        <g id="ticklabels" font-size="12" fill="#5a6577"></g>
        <path id="curve" fill="none" stroke="var(--kurve)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
        <line id="ptv" stroke="#9aa4b8" stroke-width="1.2" stroke-dasharray="4 4"/>
        <circle id="orig" r="3.4" fill="#333"/>
        <circle id="pt" r="7" fill="var(--punkt)" stroke="#fff" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="seite">
      <div class="panel termbox">
        <div class="term" id="rTerm">f(x) = x²</div>
      </div>

      <div class="panel controls">
        <label for="sA">Faktor a: <b id="lA">1</b></label>
        <input id="sA" type="range" min="-10" max="10" step="0.25" value="1" aria-label="Faktor a">
        <label for="sN">Exponent n (natürliche Zahl): <b id="lN">2</b></label>
        <input id="sN" type="range" min="1" max="20" step="1" value="2" aria-label="Exponent n">

        <div class="opt"><input type="checkbox" id="optB"><label for="optB" style="margin:0">Version <b>a·xⁿ + b</b> zuschalten</label></div>
        <div id="boxB" hidden>
          <label for="sB">Summand b: <b id="lB">0</b></label>
          <input id="sB" type="range" min="-3" max="3" step="0.25" value="0" aria-label="Summand b">
        </div>

        <div class="btns">
          <button id="reset">Zurücksetzen</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const fig=document.getElementById('fig');
  const $=id=>document.getElementById(id);
  const NS='http://www.w3.org/2000/svg';

  // ---- Plot-Geometrie ----
  const VBW=440, PX0=44, PX1=424, PY0=28, PY1=408;
  const XMIN=-2.2, XMAX=2.2, YMIN=-4.4, YMAX=4.4;
  const sx=x=>PX0+(x-XMIN)/(XMAX-XMIN)*(PX1-PX0);
  const sy=y=>PY1-(y-YMIN)/(YMAX-YMIN)*(PY1-PY0);

  // ---- Zustand ----
  let a=1, n=2, b=0, useB=false, x0=1;

  // ---- Helfer ----
  const SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const toSup=k=>String(k).split('').map(d=>SUPD[d]).join('');
  function numDE(x){ let s=(Math.round(x*100)/100).toString(); s=s.replace('.',','); s=s.replace('-','−'); return s; }
  function f(x){ return a*Math.pow(x,n) + (useB?b:0); }
  function el(name,attrs){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

  // ---- Gitter + Achsen (einmalig) ----
  function buildGrid(){
    const g=$('grid'), tl=$('ticklabels');
    for(let x=-2;x<=2;x++){ g.appendChild(el('line',{x1:sx(x),y1:sy(YMIN),x2:sx(x),y2:sy(YMAX),stroke:'#e6ebf5','stroke-width':1})); }
    for(let y=-4;y<=4;y++){ g.appendChild(el('line',{x1:sx(XMIN),y1:sy(y),x2:sx(XMAX),y2:sy(y),stroke:'#e6ebf5','stroke-width':1})); }
    $('axX').setAttribute('x1',sx(XMIN)); $('axX').setAttribute('y1',sy(0)); $('axX').setAttribute('x2',sx(XMAX)); $('axX').setAttribute('y2',sy(0));
    $('axY').setAttribute('x1',sx(0)); $('axY').setAttribute('y1',sy(YMIN)); $('axY').setAttribute('x2',sx(0)); $('axY').setAttribute('y2',sy(YMAX));
    // Pfeilspitzen
    g.appendChild(el('path',{d:`M ${sx(XMAX)} ${sy(0)} l -8 -4 l 0 8 z`,fill:'#5a6577'}));
    g.appendChild(el('path',{d:`M ${sx(0)} ${sy(YMAX)} l -4 8 l 8 0 z`,fill:'#5a6577'}));
    tl.appendChild(el('text',{x:sx(XMAX)-4,y:sy(0)+16,'text-anchor':'end'})).textContent='x';
    tl.appendChild(el('text',{x:sx(0)+8,y:sy(YMAX)+10})).textContent='y';
    for(const x of [-2,-1,1,2]){ const t=el('text',{x:sx(x),y:sy(0)+16,'text-anchor':'middle'}); t.textContent=numDE(x); tl.appendChild(t); }
    for(const y of [-4,-2,2,4]){ const t=el('text',{x:sx(0)-8,y:sy(y)+4,'text-anchor':'end'}); t.textContent=numDE(y); tl.appendChild(t); }
  }

  // ---- Kurve mit Randbeschneidung ----
  function curveD(){
    const dx=0.01; let subs=[], cur=[], pIn=false, pX=null, pY=null;
    const clampEdge=(y)=> y>YMAX?YMAX:YMIN;
    for(let x=XMIN;x<=XMAX+1e-9;x+=dx){
      const y=f(x), inside=(y>=YMIN&&y<=YMAX);
      if(inside){
        if(!pIn && pX!==null){ const yb=clampEdge(pY), t=(yb-pY)/(y-pY), xb=pX+(x-pX)*t; cur.push([xb,yb]); }
        cur.push([x,y]);
      }else if(pIn){ const yb=clampEdge(y), t=(yb-pY)/(y-pY), xb=pX+(x-pX)*t; cur.push([xb,yb]); subs.push(cur); cur=[]; }
      pIn=inside; pX=x; pY=y;
    }
    if(cur.length) subs.push(cur);
    return subs.map(s=>'M '+s.map(p=>sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' L ')).join(' ');
  }

  // ---- Termanzeige ----
  function termText(){
    let coef = a===1?'':(a===-1?'−':numDE(a)+'·');
    let base = 'x'+(n===1?'':toSup(n));
    let t = 'f(x) = '+coef+base;
    if(useB){ t += (b<0? ' − '+numDE(-b) : ' + '+numDE(b)); }
    return t;
  }

  // ---- Aktualisieren ----
  function update(){
    $('curve').setAttribute('d',curveD());
    $('orig').setAttribute('cx',sx(0)); $('orig').setAttribute('cy',sy(0));
    const fy=f(x0);
    const pyClamped=Math.max(YMIN,Math.min(YMAX,fy));
    $('pt').setAttribute('cx',sx(x0)); $('pt').setAttribute('cy',sy(pyClamped));
    const showV = Math.abs(x0)>0.02;
    $('ptv').style.display = showV?'':'none';
    if(showV){ $('ptv').setAttribute('x1',sx(x0)); $('ptv').setAttribute('y1',sy(0)); $('ptv').setAttribute('x2',sx(x0)); $('ptv').setAttribute('y2',sy(pyClamped)); }
    // Termanzeige
    $('rTerm').textContent=termText();
    // Regler-Labels
    $('lA').textContent=numDE(a); $('lN').textContent=n; $('lB').textContent=numDE(b);
  }

  // ---- Punkt ziehen (x aus Zeigerposition) ----
  let drag=false;
  function worldX(e){ const r=fig.getBoundingClientRect(); const svgx=(e.clientX-r.left)*(VBW/r.width); return XMIN+(svgx-PX0)/(PX1-PX0)*(XMAX-XMIN); }
  function setX(x){ x0=Math.max(XMIN,Math.min(XMAX,x)); update(); }
  fig.addEventListener('pointerdown',e=>{drag=true; fig.setPointerCapture(e.pointerId); setX(worldX(e));});
  fig.addEventListener('pointermove',e=>{ if(drag) setX(worldX(e)); });
  fig.addEventListener('pointerup',()=>drag=false);
  fig.addEventListener('pointercancel',()=>drag=false);

  // ---- Regler / Buttons ----
  $('sA').addEventListener('input',()=>{a=+$('sA').value; update();});
  $('sN').addEventListener('input',()=>{n=+$('sN').value; update();});
  $('sB').addEventListener('input',()=>{b=+$('sB').value; update();});
  $('optB').addEventListener('change',()=>{ useB=$('optB').checked; $('boxB').hidden=!useB; $('curve').setAttribute('stroke', useB?'var(--kurveB)':'var(--kurve)'); update(); });
  $('reset').addEventListener('click',()=>{
    a=1;n=2;b=0;useB=false;x0=1;
    $('sA').value=1; $('sN').value=2; $('sB').value=0; $('optB').checked=false; $('boxB').hidden=true;
    $('curve').setAttribute('stroke','var(--kurve)'); update();
  });

  buildGrid(); update();
})();
</script>
<script>
/* Funktionsterm automatisch auf Panelbreite verkleinern (einzeilig) */
(function(){
  const box=document.querySelector('.termbox');
  function fit(){
    for(const el of box.querySelectorAll('.term,.term2')){
      if(!el.dataset.max) el.dataset.max=parseFloat(getComputedStyle(el).fontSize);
      let fs=+el.dataset.max; el.style.fontSize=fs+'px';
      while(el.scrollWidth>el.clientWidth && fs>12){ fs-=1; el.style.fontSize=fs+'px'; }
    }
  }
  new MutationObserver(fit).observe(box,{subtree:true,childList:true,characterData:true});
  addEventListener('resize',fit); fit();
})();
</script>
</body>
</html>
