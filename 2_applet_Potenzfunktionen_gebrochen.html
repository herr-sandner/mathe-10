<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potenzfunktionen mit gebrochenen Exponenten</title>
<style>
  :root{
    --akzent:#2E5AAC; --akzent-dunkel:#1c3a72;
    --grau:#666; --bg:#ffffff; --panel:#f2f5fb; --rand:#cdd8ee;
    --kurve:#2856BE; --punkt:#C77F1A; --kurveB:#127a4b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#1b1b1b;background:var(--bg);}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  h1{font-size:1.25rem;color:var(--akzent-dunkel);margin:.2rem 0 1rem;}
  .layout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;}
  .figur{flex:3 1 560px;min-width:320px;}
  .seite{flex:1 1 250px;min-width:240px;}
  svg{width:100%;height:auto;touch-action:none;user-select:none;}
  text{font-family:inherit;}
  .panel{background:var(--panel);border:1px solid var(--rand);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .termbox{padding:22px 16px;}
  .term,.term2{white-space:nowrap;overflow:hidden;}
  .term{text-align:center;font-size:2.1rem;line-height:1.3;font-weight:700;color:var(--akzent-dunkel);padding:2px 0 2px;font-variant-numeric:tabular-nums;}
  .term2{text-align:center;font-size:1.5rem;font-weight:600;color:var(--grau);padding:0 0 6px;}
  .term sup, .term2 sup{font-size:.7em;}
  .controls label{display:block;font-size:.9rem;color:var(--grau);margin:.5rem 0 .3rem;}
  input[type=range]{width:100%;accent-color:var(--akzent);}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  button{font:inherit;border:1px solid var(--akzent);background:#fff;color:var(--akzent);border-radius:8px;padding:7px 12px;cursor:pointer;}
  button:hover{background:var(--akzent);color:#fff;}
  button:focus-visible{outline:3px solid #9db6e6;outline-offset:2px;}
  .opt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;color:#1b1b1b;}
  .opt input{width:18px;height:18px;}
  #boxB[hidden]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Potenzfunktionen mit gebrochenen Exponenten</h1>
  <div class="layout">
    <div class="figur">
      <svg id="fig" viewBox="0 0 600 440" aria-label="Koordinatensystem mit dem Graphen einer Wurzelfunktion f(x) = a·x hoch 1/n; Faktor a und Wurzelexponent n einstellbar. Bei ungeradem n ist der Graph auch für negative x gestrichelt eingezeichnet. Ein Punkt lässt sich am Graphen verschieben.">
        <g id="grid"></g>
        <rect id="verboten" fill="#f4f6fa" opacity="0.7"/>
        <line id="axX" stroke="#5a6577" stroke-width="1.4"/>
        <line id="axY" stroke="#5a6577" stroke-width="1.4"/>
        <g id="ticklabels" font-size="12" fill="#5a6577"></g>
        <path id="curve" fill="none" stroke="var(--kurve)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="curveNeg" fill="none" stroke="var(--kurve)" stroke-width="2.8" stroke-dasharray="9 6" stroke-linejoin="round"/>
        <line id="ptv" stroke="#9aa4b8" stroke-width="1.2" stroke-dasharray="4 4"/>
        <circle id="orig" r="3.4" fill="#333"/>
        <circle id="pt" r="7" fill="var(--punkt)" stroke="#fff" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="seite">
      <div class="panel termbox">
        <div class="term" id="rTerm">f(x) = x<sup>1/2</sup></div>
        <div class="term2" id="rTerm2">= &radic;x</div>
      </div>

      <div class="panel controls">
        <label for="sA">Faktor a: <b id="lA">1</b></label>
        <input id="sA" type="range" min="-10" max="10" step="0.25" value="1" aria-label="Faktor a">
        <label for="sQ">Wurzelexponent n (Nenner): <b id="lQ">2</b></label>
        <input id="sQ" type="range" min="2" max="20" step="1" value="2" aria-label="Wurzelexponent n">

        <div class="opt"><input type="checkbox" id="optB"><label for="optB" style="margin:0">Version <b>a·x<sup>1/n</sup> + b</b> zuschalten</label></div>
        <div id="boxB" hidden>
          <label for="sB">Summand b: <b id="lB">0</b></label>
          <input id="sB" type="range" min="-10" max="10" step="0.25" value="0" aria-label="Summand b">
        </div>

        <div class="btns">
          <button id="reset">Zurücksetzen</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const fig=document.getElementById('fig');
  const $=id=>document.getElementById(id);
  const NS='http://www.w3.org/2000/svg';

  // ---- Plot-Geometrie ----
  const VBW=600, PX0=24, PX1=584, PY0=28, PY1=408;
  const XMIN=-6.5, XMAX=6.5, YMIN=-4.4, YMAX=4.4;
  const sx=x=>PX0+(x-XMIN)/(XMAX-XMIN)*(PX1-PX0);
  const sy=y=>PY1-(y-YMIN)/(YMAX-YMIN)*(PY1-PY0);

  // ---- Zustand ----
  let a=1, q=2, b=0, useB=false, x0=1;
  const odd=()=>q%2===1;

  // ---- Helfer ----
  function numDE(x,d=2){ let s=(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toString(); s=s.replace('.',','); s=s.replace('-','−'); return s; }
  function root(x){ return x>=0 ? Math.pow(x,1/q) : (odd() ? -Math.pow(-x,1/q) : NaN); }
  function f(x){ return a*root(x) + (useB?b:0); }
  function el(name,attrs){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

  // ---- Gitter + Achsen (einmalig) ----
  function buildGrid(){
    const g=$('grid'), tl=$('ticklabels');
    // verbotener Bereich x<0 (nicht im Definitionsbereich)
    $('verboten').setAttribute('x',sx(XMIN)); $('verboten').setAttribute('y',sy(YMAX));
    $('verboten').setAttribute('width',sx(0)-sx(XMIN)); $('verboten').setAttribute('height',sy(YMIN)-sy(YMAX));
    for(let x=-6;x<=6;x++){ g.appendChild(el('line',{x1:sx(x),y1:sy(YMIN),x2:sx(x),y2:sy(YMAX),stroke:'#e6ebf5','stroke-width':1})); }
    for(let y=-4;y<=4;y++){ g.appendChild(el('line',{x1:sx(XMIN),y1:sy(y),x2:sx(XMAX),y2:sy(y),stroke:'#e6ebf5','stroke-width':1})); }
    $('axX').setAttribute('x1',sx(XMIN)); $('axX').setAttribute('y1',sy(0)); $('axX').setAttribute('x2',sx(XMAX)); $('axX').setAttribute('y2',sy(0));
    $('axY').setAttribute('x1',sx(0)); $('axY').setAttribute('y1',sy(YMIN)); $('axY').setAttribute('x2',sx(0)); $('axY').setAttribute('y2',sy(YMAX));
    g.appendChild(el('path',{d:`M ${sx(XMAX)} ${sy(0)} l -8 -4 l 0 8 z`,fill:'#5a6577'}));
    g.appendChild(el('path',{d:`M ${sx(0)} ${sy(YMAX)} l -4 8 l 8 0 z`,fill:'#5a6577'}));
    tl.appendChild(el('text',{x:sx(XMAX)-4,y:sy(0)+16,'text-anchor':'end'})).textContent='x';
    tl.appendChild(el('text',{x:sx(0)+8,y:sy(YMAX)+10})).textContent='y';
    for(const x of [-6,-5,-4,-3,-2,-1,1,2,3,4,5,6]){ const t=el('text',{x:sx(x),y:sy(0)+16,'text-anchor':'middle'}); t.textContent=numDE(x,0); tl.appendChild(t); }
    for(const y of [-4,-2,2,4]){ const t=el('text',{x:sx(0)-8,y:sy(y)+4,'text-anchor':'end'}); t.textContent=numDE(y,0); tl.appendChild(t); }
  }

  // ---- Kurve (nur x >= 0) mit Randbeschneidung ----
  function curveD(xa,xb){
    const dx=0.005; let subs=[], cur=[], pIn=false, pX=null, pY=null;
    for(let x=xa;x<=xb+1e-9;x+=dx){
      const y=f(x), fin=isFinite(y), inside=fin && y>=YMIN && y<=YMAX;
      if(inside){
        if(!pIn && pX!==null && isFinite(pY)){ const yb=pY>YMAX?YMAX:YMIN, t=(yb-pY)/(y-pY), xb=pX+(x-pX)*t; if(isFinite(xb)) cur.push([xb,yb]); }
        cur.push([x,y]);
      } else if(pIn){
        if(fin && isFinite(pY)){ const yb=y>YMAX?YMAX:YMIN, t=(yb-pY)/(y-pY), xb=pX+(x-pX)*t; if(isFinite(xb)) cur.push([xb,yb]); }
        subs.push(cur); cur=[];
      }
      pIn=inside; pX=x; pY=y;
    }
    if(cur.length) subs.push(cur);
    return subs.filter(s=>s.length>1).map(s=>'M '+s.map(pt=>sx(pt[0]).toFixed(1)+' '+sy(pt[1]).toFixed(1)).join(' L ')).join(' ');
  }

  // ---- Termanzeige ----
  function coefHTML(){ return a===1?'':(a===-1?'−':numDE(a)+'·'); }
  function termHTML(){
    let t = 'f(x) = '+coefHTML()+'x<sup>1/'+q+'</sup>';
    if(useB){ t += (b<0? ' − '+numDE(-b) : ' + '+numDE(b)); }
    return t;
  }
  function rootHTML(){
    const idx = (q===2) ? '' : '<sup>'+q+'</sup>';
    const radWrapped = 'x';
    let t = '= '+coefHTML()+idx+'&radic;'+radWrapped;
    if(useB){ t += (b<0? ' − '+numDE(-b) : ' + '+numDE(b)); }
    return t;
  }

  // ---- Aktualisieren ----
  function update(){
    $('curve').setAttribute('d',curveD(0,XMAX));
    $('curveNeg').setAttribute('d', odd()? curveD(XMIN,0) : '');
    $('verboten').style.display = odd()? 'none' : '';
    if(!odd() && x0<0) x0=0;
    // Startpunkt: bei x=0 ist f(0)=b (bzw. 0)
    const startY=useB?b:0;
    const showStart = startY>=YMIN && startY<=YMAX;
    $('orig').style.display = showStart?'':'none';
    if(showStart){ $('orig').setAttribute('cx',sx(0)); $('orig').setAttribute('cy',sy(startY)); }
    const fy=f(x0);
    const defined = isFinite(fy);
    if(defined){
      const pyC=Math.max(YMIN,Math.min(YMAX,fy));
      $('pt').style.display=''; $('ptv').style.display= Math.abs(x0)>0.02?'':'none';
      $('pt').setAttribute('cx',sx(x0)); $('pt').setAttribute('cy',sy(pyC));
      $('ptv').setAttribute('x1',sx(x0)); $('ptv').setAttribute('y1',sy(0)); $('ptv').setAttribute('x2',sx(x0)); $('ptv').setAttribute('y2',sy(pyC));
    } else { $('pt').style.display='none'; $('ptv').style.display='none'; }
    // Termanzeige
    $('rTerm').innerHTML=termHTML();
    $('rTerm2').innerHTML=rootHTML();
    $('lA').textContent=numDE(a); $('lQ').textContent=q; $('lB').textContent=numDE(b);
  }

  // ---- Punkt ziehen (x aus Zeigerposition, nur x>=0) ----
  let drag=false;
  function worldX(e){ const r=fig.getBoundingClientRect(); const svgx=(e.clientX-r.left)*(VBW/r.width); return XMIN+(svgx-PX0)/(PX1-PX0)*(XMAX-XMIN); }
  function setX(x){ x0=Math.max(odd()?XMIN:0,Math.min(XMAX,x)); update(); }
  fig.addEventListener('pointerdown',e=>{drag=true; fig.setPointerCapture(e.pointerId); setX(worldX(e));});
  fig.addEventListener('pointermove',e=>{ if(drag) setX(worldX(e)); });
  fig.addEventListener('pointerup',()=>drag=false);
  fig.addEventListener('pointercancel',()=>drag=false);

  // ---- Regler / Buttons ----
  $('sA').addEventListener('input',()=>{a=+$('sA').value; update();});
  $('sQ').addEventListener('input',()=>{q=+$('sQ').value; update();});
  $('sB').addEventListener('input',()=>{b=+$('sB').value; update();});
  $('optB').addEventListener('change',()=>{ useB=$('optB').checked; $('boxB').hidden=!useB; for(const id of ['curve','curveNeg']) $(id).setAttribute('stroke', useB?'var(--kurveB)':'var(--kurve)'); update(); });
  $('reset').addEventListener('click',()=>{
    a=1;q=2;b=0;useB=false;x0=1;
    $('sA').value=1; $('sQ').value=2; $('sB').value=0; $('optB').checked=false; $('boxB').hidden=true;
    for(const id of ['curve','curveNeg']) $(id).setAttribute('stroke','var(--kurve)'); update();
  });

  buildGrid(); update();
})();
</script>
<script>
/* Funktionsterm automatisch auf Panelbreite verkleinern (einzeilig) */
(function(){
  const box=document.querySelector('.termbox');
  function fit(){
    for(const el of box.querySelectorAll('.term,.term2')){
      if(!el.dataset.max) el.dataset.max=parseFloat(getComputedStyle(el).fontSize);
      let fs=+el.dataset.max; el.style.fontSize=fs+'px';
      while(el.scrollWidth>el.clientWidth && fs>12){ fs-=1; el.style.fontSize=fs+'px'; }
    }
  }
  new MutationObserver(fit).observe(box,{subtree:true,childList:true,characterData:true});
  addEventListener('resize',fit); fit();
})();
</script>
</body>
</html>
